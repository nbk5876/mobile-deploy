name: Deploy app to Core3 (SFTP)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder under mdb/ to deploy (e.g. a1)"
        required: true
        default: a1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check app folder exists
        run: test -d "mdb/${{ inputs.app }}" || { echo "mdb/${{ inputs.app }} not found"; exit 1; }

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
          APP: ${{ inputs.app }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<EOF2
          set sftp:auto-confirm yes
          mirror -R --verbose "mdb/$APP" "$SFTP_PATH/$APP"
          bye
          EOF2
