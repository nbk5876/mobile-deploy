<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f6b63">
<meta property="og:type" content="website">
<meta property="og:title" content="RxKeep">
<meta property="og:description" content="Prescription inventory and daily dose tracker.">
<meta property="og:url" content="https://www.core3.com/mdb/a4/">
<meta property="og:image" content="https://www.core3.com/mdb/a4/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="https://www.core3.com/mdb/a4/apple-touch-icon.png">
<title>RxKeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: single column, header + one of three views, fixed bottom tab bar, bottom-sheet editor */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#14201e; --muted:#5b6b67; --line:#d9e2de;
  --accent:#0f6b63; --accent-ink:#ffffff;
  --ok:#2e7d4f; --okbg:#e4f3ea; --warn:#9a5b00; --warnbg:#fff1d6; --bad:#b3261e; --badbg:#fde8e6;
  --display:'Sora',system-ui,sans-serif; --body:'Source Sans 3',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1715; --surface:#16221f; --ink:#e6efec; --muted:#93a6a1; --line:#263632;
    --accent:#4fc3b6; --accent-ink:#06201d;
    --ok:#6fd39a; --okbg:#12301f; --warn:#f0b45a; --warnbg:#33270f; --bad:#ff8a80; --badbg:#3a1613;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1715; --surface:#16221f; --ink:#e6efec; --muted:#93a6a1; --line:#263632;
  --accent:#4fc3b6; --accent-ink:#06201d;
  --ok:#6fd39a; --okbg:#12301f; --warn:#f0b45a; --warnbg:#33270f; --bad:#ff8a80; --badbg:#3a1613;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:6px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font:700 24px/1.1 var(--display);margin:0;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.date{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
h2{font:700 13px/1 var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* summary */
.summary{display:flex;flex-direction:column;gap:10px}
.summary .big{font:700 22px/1.2 var(--display)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .25s}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 14px;font-size:15px}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert.info{background:var(--okbg);color:var(--ok)}
.alert b{font-weight:700}
.alert button{margin-left:auto;background:none;border:1px solid currentColor;border-radius:8px;padding:4px 10px;font-weight:600;white-space:nowrap}

/* today */
.slot{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px}
.slot h3{font:700 17px/1 var(--display);margin:0;font-variant-numeric:tabular-nums}
.dose{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.dose .tick{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;color:transparent}
.dose[aria-pressed="true"]{background:var(--okbg);border-color:transparent}
.dose[aria-pressed="true"] .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dose[aria-pressed="true"] .nm{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.75}
.nm{font-weight:700;font-size:17px;line-height:1.2}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:13px;font-weight:700;line-height:1.5}
.chip.due{background:var(--warnbg);color:var(--warn)}
.chip.ex{background:var(--line);color:var(--muted)}
.chip.low{background:var(--warnbg);color:var(--warn)}
.chip.out{background:var(--badbg);color:var(--bad)}
.chip.good{background:var(--okbg);color:var(--ok)}

/* meds */
.med{display:flex;flex-direction:column;gap:10px}
.med .top{display:flex;gap:10px;align-items:flex-start}
.med .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px}
.btns{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.fab{position:fixed;right:max(16px,calc(50% - 280px + 16px));bottom:calc(76px + env(safe-area-inset-bottom));
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:0 20px;height:52px;font-weight:700;
  box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{background:none;border:0;height:60px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px}
nav button[aria-current="page"]{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.panel h2.t{font:700 20px/1.2 var(--display);text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 14px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;width:100%;min-height:46px}
textarea{min-height:80px;resize:vertical}
.field{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.times .tr{display:flex;gap:8px;margin-bottom:8px}
.times .tr input{flex:1}
.err{color:var(--bad);font-weight:600;margin:0 0 10px}
.foot{color:var(--muted);font-size:13px;margin:28px 0 8px;text-align:center}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.field.flag input,.field.flag select,.field.flag textarea{border-color:var(--warn);box-shadow:0 0 0 2px var(--warnbg)}
.field.flag>label::after{content:' · check this';color:var(--warn);font-weight:700}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<header class="wrap">
  <div class="brand"><h1>Rx<span>Keep</span></h1><div class="date num" id="today-label"></div></div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<div id="sheet-host"></div>
<input type="file" id="photo-input" class="vh" accept="image/*" multiple tabindex="-1" aria-hidden="true">
<nav aria-label="Sections"><div class="in">
  <button data-tab="today" aria-label="Today">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-tab="meds" aria-label="Medications">
    <svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-35 12 12)"/><path d="M9.5 8.2l5 7.2" /></svg>Meds</button>
  <button data-tab="backup" aria-label="Backup">
    <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Backup</button>
</div></nav>

<script>
(function(){
'use strict';
var KEY='rxkeep.v1';
var state=null, tab='today', storageOk=true, editing=null, confirmKey=null, flash='';

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtTime(t){var p=t.split(':'),h=+p[0],m=p[1],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+m+' '+ap;}
function fmtClock(ts){var d=new Date(ts);return fmtTime(pad(d.getHours())+':'+pad(d.getMinutes()));}
function round2(n){return Math.round(n*100)/100;}
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function plural(n,w){return n===1?w:(w==='box'?'boxes':w+'s');}

/* ---------- storage ---------- */
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&Array.isArray(s.meds))return normalize(s);}}catch(e){}
  return null;
}
function normalize(s){
  s.log=s.log&&typeof s.log==='object'?s.log:{};
  s.meds=s.meds.map(function(m){
    return {id:m.id||uid(),name:m.name||'Unnamed',strength:m.strength||'',unit:m.unit||'tablet',
      perDose:+m.perDose>0?+m.perDose:1,times:Array.isArray(m.times)&&m.times.length?m.times:['08:00'],
      qty:+m.qty>=0?+m.qty:0,fillQty:+m.fillQty>0?+m.fillQty:(+m.qty||1),refills:+m.refills>=0?+m.refills:0,
      pharmacy:m.pharmacy||'',prescriber:m.prescriber||'',directions:m.directions||'',notes:m.notes||'',example:!!m.example};
  });
  return s;
}
var cloud={doc:null,ok:null,busy:false,dirty:false};
var booting=!!(window.claude&&window.claude.use);
function save(){
  var keys=Object.keys(state.log).sort();
  while(keys.length>90){delete state.log[keys.shift()];}
  try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true;}catch(e){storageOk=false;}
  if(cloud.doc){cloud.dirty=true;flushCloud();}
}
async function flushCloud(){
  if(cloud.busy)return;
  cloud.busy=true;
  while(cloud.dirty){
    cloud.dirty=false;
    try{await cloud.doc.set({json:JSON.stringify(state),updated:Date.now()});cloud.ok=true;}
    catch(e){cloud.ok=false;}
  }
  cloud.busy=false;
  var el=document.getElementById('save-status');
  if(el)el.textContent=saveStatusText();
}
function saveStatusText(){
  if(cloud.doc)return cloud.ok===false?'Could not save to your Claude account. Copy a backup now.':'Saved to your Claude account. Only you can see it.';
  return storageOk?'Saved in this browser only. Copy a backup to be safe.':'Not saving. Copy a backup now.';
}
function seed(){return {meds:[],log:{}};}

/* ---------- supply math ---------- */
function perDay(m){return m.perDose*m.times.length;}
function daysLeft(m){var p=perDay(m);return p>0?Math.floor(m.qty/p):Infinity;}
function supplyStatus(m){
  if(m.qty<=0)return 'out';
  var d=daysLeft(m);
  return d<=3?'bad':(d<=7?'low':'good');
}

/* ---------- actions ---------- */
function toggleDose(key){
  var k=dayKey(),id=key.split('|')[0];
  var m=state.meds.filter(function(x){return x.id===id;})[0];
  if(!m)return;
  state.log[k]=state.log[k]||{};
  var e=state.log[k][key];
  if(e){m.qty=round2(m.qty+e.n);delete state.log[k][key];}
  else{var n=Math.min(m.perDose,m.qty);m.qty=round2(m.qty-n);state.log[k][key]={t:Date.now(),n:n};}
  save();render();
}
function refilled(id){
  var m=state.meds.filter(function(x){return x.id===id;})[0];
  if(!m)return;
  m.qty=round2(m.qty+m.fillQty);
  if(m.refills>0)m.refills-=1;
  save();render();
}
function deleteMed(id){
  state.meds=state.meds.filter(function(x){return x.id!==id;});
  save();closeSheet();render();
}
function removeExamples(){
  state.meds=state.meds.filter(function(x){return !x.example;});
  save();render();
}

/* ---------- views ---------- */
function viewToday(){
  var k=dayKey(),log=state.log[k]||{},now=new Date();
  var nowT=pad(now.getHours())+':'+pad(now.getMinutes());
  var doses=[];
  state.meds.forEach(function(m){m.times.forEach(function(t){doses.push({m:m,t:t,key:m.id+'|'+t});});});
  doses.sort(function(a,b){return a.t.localeCompare(b.t)||a.m.name.localeCompare(b.m.name);});
  var taken=doses.filter(function(d){return log[d.key];}).length;
  var pct=doses.length?Math.round(taken/doses.length*100):0;
  var h='';
  if(!storageOk&&!cloud.doc)h+='<div class="alert warn" style="margin-bottom:10px">Saving is not available in this view. Your changes will be lost when you leave. Copy your data from Backup first.</div>';
  var hasEx=state.meds.some(function(m){return m.example;});
  if(hasEx)h+='<div class="alert info" style="margin-bottom:10px"><span>These are <b>example</b> medications.</span><button data-act="rm-examples">Remove</button></div>';
  h+='<div class="card summary"><div class="big num">'+taken+' of '+doses.length+' '+plural(doses.length,'dose')+' taken</div>'+
     '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div></div>';
  var low=state.meds.filter(function(m){return supplyStatus(m)!=='good';});
  if(low.length){
    h+='<h2>Supply</h2><div class="stack">';
    low.forEach(function(m){
      var s=supplyStatus(m);
      var msg=s==='out'?'<b>'+esc(m.name)+'</b> is out.':'<b>'+esc(m.name)+'</b> has about '+daysLeft(m)+' '+plural(daysLeft(m),'day')+' left.';
      msg+=m.refills>0?' '+m.refills+' '+plural(m.refills,'refill')+' remaining.':' No refills remaining. Call your prescriber.';
      h+='<div class="alert '+(s==='low'?'warn':'bad')+'"><span>'+msg+'</span></div>';
    });
    h+='</div>';
  }
  if(!doses.length){
    h+='<div class="empty">Nothing scheduled yet. Add or import a medication in Meds, or restore a backup in Backup.</div>';
    return h;
  }
  var last='';
  doses.forEach(function(d){
    if(d.t!==last){last=d.t;h+='<div class="slot"><h3>'+fmtTime(d.t)+'</h3></div>';}
    var e=log[d.key],isTaken=!!e;
    var due=!isTaken&&d.t<=nowT;
    var sub=esc(d.m.perDose+' '+d.m.unit+(d.m.perDose===1?'':'s'))+(d.m.strength?' · '+esc(d.m.strength):'');
    h+='<div style="margin-bottom:8px"><button class="dose" data-act="dose" data-key="'+esc(d.key)+'" aria-pressed="'+isTaken+'">'+
       '<span class="tick" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'+
       '<span class="grow"><span class="nm">'+esc(d.m.name)+'</span><br><span class="muted small">'+sub+'</span></span>'+
       (isTaken?'<span class="chip good num">Taken '+fmtClock(e.t)+'</span>':(due?'<span class="chip due">Due</span>':''))+
       '</button></div>';
  });
  return h;
}

function viewMeds(){
  var h='';
  if(photo.ready)h+='<div class="stack" style="margin-top:14px"><button class="btn primary block" data-act="import-photos">Import from photos</button>'+
    '<div class="small muted">Pick 2 to 3 photos of one bottle from your camera roll. Photos are read, then discarded. Only the text you confirm is saved.</div></div>';
  if(!state.meds.length)h+='<div class="empty">No medications yet.'+(photo.ready?' Import a bottle from photos or tap Add.':' Tap Add to enter your first one.')+'</div>';
  h+='<div class="stack" style="margin-top:14px">';
  state.meds.forEach(function(m){
    var s=supplyStatus(m),d=daysLeft(m),pct=Math.max(0,Math.min(100,Math.round(m.qty/m.fillQty*100)));
    var chip=s==='out'?'<span class="chip out">Out</span>':(s==='good'?'<span class="chip good num">'+d+' days left</span>':'<span class="chip low num">'+d+' '+plural(d,'day')+' left</span>');
    h+='<div class="card med"><div class="top"><div class="grow"><div class="nm">'+esc(m.name)+(m.strength?' <span class="muted" style="font-weight:600">'+esc(m.strength)+'</span>':'')+'</div>'+
       (m.directions?'<div class="small muted">'+esc(m.directions)+'</div>':'')+'</div>'+
       (m.example?'<span class="chip ex">Example</span>':'')+chip+'</div>'+
       '<div class="bar '+(s==='bad'||s==='out'?'bad':(s==='low'?'warn':''))+'"><i style="width:'+pct+'%"></i></div>'+
       '<div class="meta num"><span>'+m.qty+' '+esc(m.unit)+(m.qty===1?'':'s')+' on hand</span>'+
       '<span>'+m.times.map(fmtTime).join(', ')+'</span>'+
       '<span>'+m.refills+' '+plural(m.refills,'refill')+' left</span>'+
       (m.pharmacy?'<span>'+esc(m.pharmacy)+'</span>':'')+
       (m.prescriber?'<span>Prescriber: '+esc(m.prescriber)+'</span>':'')+'</div>'+
       (m.notes?'<div class="small">'+esc(m.notes)+'</div>':'')+
       '<div class="btns"><button class="btn" data-act="edit" data-id="'+esc(m.id)+'">Edit</button>'+
       '<button class="btn" data-act="refill" data-id="'+esc(m.id)+'" '+(m.refills<1?'disabled style="opacity:.5"':'')+'>Refilled</button></div></div>';
  });
  h+='</div><div style="height:76px" aria-hidden="true"></div><button class="fab" data-act="add">+ Add medication</button>';
  return h;
}

function viewBackup(){
  var json=JSON.stringify(state);
  return '<h2>Back up</h2><div class="card stack">'+
    '<div class="small muted">Your data lives only in this browser on this phone. Copy it somewhere safe, like a note, so you can restore it later.</div>'+
    '<textarea id="export" class="mono" readonly rows="5" aria-label="Your data">'+esc(json)+'</textarea>'+
    '<button class="btn primary block" data-act="copy">Copy my data</button><div id="save-status" class="small muted">'+esc(saveStatusText())+'</div>'+(flash?'<div class="small" style="color:var(--ok);font-weight:600">'+esc(flash)+'</div>':'')+'</div>'+
    '<h2>Restore</h2><div class="card stack">'+
    '<div class="small muted">Paste what you copied earlier. A title or other words around it are fine. This replaces everything here.</div>'+
    '<textarea id="import" class="mono" rows="4" placeholder="Paste here" aria-label="Paste data to restore"></textarea>'+
    '<div id="import-err" class="err" hidden></div>'+
    '<button class="btn block" data-act="import">Restore from pasted data</button></div>'+
    '<h2>Reset</h2><div class="card stack">'+
    '<button class="btn danger block" data-act="clear">'+(confirmKey==='clear'?'Tap again to erase everything':'Erase all data')+'</button></div>'+
    '<p class="foot">RxKeep records what your prescription label says. It does not give medical advice. Ask your pharmacist or prescriber about doses and interactions.</p>';
}

/* ---------- sheet (add / edit) ---------- */
function blank(){return {id:'',name:'',strength:'',unit:'tablet',perDose:1,times:['08:00'],qty:30,fillQty:30,refills:0,pharmacy:'',prescriber:'',directions:'',notes:'',example:false};}
function openSheet(id){
  var m=id?state.meds.filter(function(x){return x.id===id;})[0]:null;
  editing=m?JSON.parse(JSON.stringify(m)):blank();
  editing._new=!m;confirmKey=null;renderSheet();
  var f=document.getElementById('f-name');if(f)f.focus();
}
function closeSheet(){editing=null;confirmKey=null;document.getElementById('sheet-host').innerHTML='';}
function timesHtml(){
  return editing.times.map(function(t,i){
    return '<div class="tr"><input type="time" value="'+esc(t)+'" data-time="'+i+'" aria-label="Dose time '+(i+1)+'">'+
      (editing.times.length>1?'<button class="btn" data-act="rm-time" data-i="'+i+'" aria-label="Remove time '+(i+1)+'">Remove</button>':'')+'</div>';
  }).join('');
}
function renderSheet(){
  var e=editing;
  var fl=function(k){return e._unclear&&e._unclear.indexOf(k)>=0?' flag':'';};
  document.getElementById('sheet-host').innerHTML=
   '<div class="overlay" data-act="overlay"><div class="panel" role="dialog" aria-modal="true" aria-label="'+(e._new?'Add medication':'Edit medication')+'">'+
   '<h2 class="t">'+(e._new?'Add medication':'Edit medication')+'</h2>'+
   (e._note?'<div class="alert info" style="margin-bottom:12px"><span>'+esc(e._note)+'</span></div>':'')+
   '<div id="form-err" class="err" hidden></div>'+
   '<div class="field'+fl('name')+'"><label for="f-name">Medication name</label><input id="f-name" value="'+esc(e.name)+'" autocomplete="off"></div>'+
   '<div class="two"><div class="field'+fl('strength')+'"><label for="f-strength">Strength</label><input id="f-strength" value="'+esc(e.strength)+'" placeholder="10 mg" autocomplete="off"></div>'+
   '<div class="field'+fl('unit')+'"><label for="f-unit">Form</label><select id="f-unit">'+['tablet','capsule','mL','drop','patch','puff','unit'].map(function(u){return '<option'+(u===e.unit?' selected':'')+'>'+u+'</option>';}).join('')+'</select></div></div>'+
   '<div class="field'+fl('perDose')+'"><label for="f-per">Amount per dose</label><input id="f-per" type="number" inputmode="decimal" step="0.25" min="0.25" value="'+e.perDose+'"></div>'+
   '<div class="field times'+fl('times')+'"><label>Dose times</label><div id="times">'+timesHtml()+'</div><button class="btn" data-act="add-time">Add a time</button></div>'+
   '<div class="two"><div class="field'+fl('qty')+'"><label for="f-qty">On hand now</label><input id="f-qty" type="number" inputmode="decimal" min="0" value="'+e.qty+'"></div>'+
   '<div class="field'+fl('qty')+'"><label for="f-fill">Quantity per fill</label><input id="f-fill" type="number" inputmode="decimal" min="1" value="'+e.fillQty+'"></div></div>'+
   '<div class="two"><div class="field'+fl('refills')+'"><label for="f-ref">Refills left</label><input id="f-ref" type="number" inputmode="numeric" min="0" value="'+e.refills+'"></div>'+
   '<div class="field'+fl('pharmacy')+'"><label for="f-ph">Pharmacy</label><input id="f-ph" value="'+esc(e.pharmacy)+'" autocomplete="off"></div></div>'+
   '<div class="field'+fl('prescriber')+'"><label for="f-doc">Prescriber</label><input id="f-doc" value="'+esc(e.prescriber)+'" autocomplete="off"></div>'+
   '<div class="field'+fl('directions')+'"><label for="f-dir">Directions on label</label><textarea id="f-dir">'+esc(e.directions)+'</textarea></div>'+
   '<div class="field"><label for="f-notes">Notes</label><textarea id="f-notes">'+esc(e.notes)+'</textarea></div>'+
   '<div class="btns" style="flex-wrap:wrap"><button class="btn primary" data-act="save-med" style="flex:1">Save</button>'+
   '<button class="btn" data-act="cancel" style="flex:1">Cancel</button></div>'+
   (e._new?'':'<div style="margin-top:12px"><button class="btn danger block" data-act="del-med">'+(confirmKey==='del'?'Tap again to delete':'Delete medication')+'</button></div>')+
   '</div></div>';
}
function readForm(){
  var g=function(id){return document.getElementById(id).value;};
  editing.name=g('f-name').trim();editing.strength=g('f-strength').trim();editing.unit=g('f-unit');
  editing.perDose=parseFloat(g('f-per'));editing.qty=parseFloat(g('f-qty'));editing.fillQty=parseFloat(g('f-fill'));
  editing.refills=parseInt(g('f-ref'),10);editing.pharmacy=g('f-ph').trim();editing.prescriber=g('f-doc').trim();
  editing.directions=g('f-dir').trim();editing.notes=g('f-notes').trim();
}
function saveMed(){
  readForm();
  var e=editing,err='';
  if(!e.name)err='Enter the medication name.';
  else if(!(e.perDose>0))err='Amount per dose must be more than 0.';
  else if(!(e.qty>=0))err='Enter how many you have on hand now (0 or more).';
  else if(!(e.fillQty>0))err='Enter the quantity per fill (1 or more).';
  else if(isNaN(e.refills)||e.refills<0)err='Refills left must be 0 or more.';
  else if(e.times.some(function(t){return !t;}))err='Every dose time needs a time. Remove blank ones.';
  if(err){var box=document.getElementById('form-err');box.textContent=err;box.hidden=false;box.scrollIntoView({block:'nearest'});return;}
  var uniq=[];e.times.forEach(function(t){if(uniq.indexOf(t)<0)uniq.push(t);});
  e.times=uniq.sort();delete e._note;delete e._unclear;
  if(e._new){e.id=uid();delete e._new;state.meds.push(e);}
  else{delete e._new;e.example=false;state.meds=state.meds.map(function(x){return x.id===e.id?e:x;});}
  save();closeSheet();render();
}

/* ---------- render ---------- */
function render(){
  document.getElementById('today-label').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  var v=document.getElementById('view');
  v.innerHTML=booting?'<div class="empty">Loading your medications...</div>':(tab==='today'?viewToday():(tab==='meds'?viewMeds():viewBackup()));
  Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){
    if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act],[data-tab]');
  if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;confirmKey=null;flash='';render();window.scrollTo(0,0);return;}
  var a=t.dataset.act;
  if(a==='overlay'){if(ev.target===t)closeSheet();return;}
  if(a==='dose')toggleDose(t.dataset.key);
  else if(a==='rm-examples')removeExamples();
  else if(a==='add')openSheet(null);
  else if(a==='edit')openSheet(t.dataset.id);
  else if(a==='refill')refilled(t.dataset.id);
  else if(a==='import-photos')document.getElementById('photo-input').click();
  else if(a==='cancel-read'){if(photo.ctl)photo.ctl.abort();}
  else if(a==='cancel')closeSheet();
  else if(a==='save-med')saveMed();
  else if(a==='add-time'){readForm();editing.times.push('12:00');document.getElementById('times').innerHTML=timesHtml();}
  else if(a==='rm-time'){readForm();editing.times.splice(+t.dataset.i,1);document.getElementById('times').innerHTML=timesHtml();}
  else if(a==='del-med'){if(confirmKey==='del')deleteMed(editing.id);else{readForm();confirmKey='del';renderSheet();}}
  else if(a==='clear'){
    if(confirmKey==='clear'){state={meds:[],log:{}};save();confirmKey=null;flash='';render();}
    else{confirmKey='clear';render();}
  }
  else if(a==='copy'){
    var ta=document.getElementById('export'),done=function(){flash='Copied. Paste it into a note to keep it.';render();};
    var fallback=function(){ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){flash='Select the text above and copy it.';render();}};
    try{navigator.clipboard.writeText(ta.value).then(done,fallback);}catch(e){fallback();}
  }
  else if(a==='import'){
    var raw=document.getElementById('import').value.trim(),box=document.getElementById('import-err');
    try{
      var i0=raw.indexOf('{'),i1=raw.lastIndexOf('}');
      if(i0<0||i1<i0)throw new Error('x');
      var s=JSON.parse(raw.slice(i0,i1+1));
      if(!s||!Array.isArray(s.meds))throw new Error('x');
      state=normalize(s);save();flash='Restored.';render();
    }catch(e){box.textContent='That is not RxKeep data. Copy it again from Backup on the other device and paste all of it.';box.hidden=false;}
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(editing&&el.dataset&&el.dataset.time!==undefined){editing.times[+el.dataset.time]=el.value;}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&editing)closeSheet();});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!editing)render();});

/* ---------- photo import (reads label text with Claude where the page allows it) ---------- */
var UNITS=['tablet','capsule','mL','drop','patch','puff','unit'];
var TIMES={1:['08:00'],2:['08:00','20:00'],3:['08:00','14:00','20:00'],4:['08:00','12:00','16:00','20:00']};
var FIELDS=['name','strength','unit','perDose','times','qty','refills','pharmacy','prescriber','directions'];
var photo={ready:false,max:3,sample:null,ctl:null};

function labelPrompt(n){
  return 'These '+n+' photos show one prescription bottle, taken from different sides of the same label. Read the printed label and reply with only one JSON object with these keys:\n'+
  'name (drug name as printed), strength (like "10 mg"), unit (one of tablet, capsule, mL, drop, patch, puff, unit), perDose (number of units per dose, from the directions), '+
  'timesPerDay (doses per day from the directions; for "every N hours" use 24 divided by N; null if as needed or unclear), qty (quantity dispensed, a number), '+
  'refills (refills remaining, a whole number), pharmacy (pharmacy name), prescriber (prescribing doctor name), directions (the directions text as printed), '+
  'unclear (array of the key names above that you could not read confidently).\n'+
  'Rules: copy only what is printed and never guess. Use null for anything you cannot see. Do not output the patient name, address, phone numbers, Rx number or any other personal identifier.\n'+
  'Shape example: {"name":"...","strength":"10 mg","unit":"tablet","perDose":1,"timesPerDay":2,"qty":60,"refills":3,"pharmacy":"...","prescriber":"...","directions":"...","unclear":[]}';
}
function showReading(n,note){
  document.getElementById('sheet-host').innerHTML=
    '<div class="overlay"><div class="panel" role="dialog" aria-modal="true" aria-label="Reading label">'+
    '<h2 class="t">Reading your label</h2><p>Reading '+n+' '+plural(n,'photo')+'. This can take up to a minute.</p>'+
    (note?'<p class="small muted">'+esc(note)+'</p>':'')+
    '<button class="btn block" data-act="cancel-read">Cancel</button></div></div>';
}
function showNotice(title,msg){
  document.getElementById('sheet-host').innerHTML=
    '<div class="overlay" data-act="overlay"><div class="panel" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'+
    '<h2 class="t">'+esc(title)+'</h2><p>'+esc(msg)+'</p><button class="btn primary block" data-act="cancel">OK</button></div></div>';
}
function readError(code){
  var m={
    not_granted:['Photo reading is off','Allow RxKeep to use Claude to read photos, or add the medication by hand.'],
    rate_limited:['Too many requests','Wait a minute, then try again.'],
    image_rejected:['Could not use those photos','Pick clear JPEG or PNG photos, then try again.'],
    invalid_json:['Could not read the label','Retake the photos closer, in good light, with the text flat to the camera. Or add the medication by hand.'],
    empty_completion:['Could not read the label','Retake the photos closer, in good light. Or add the medication by hand.'],
    refused:['Could not read those photos','Try different photos of the label, or add the medication by hand.'],
    session_expired:['Sign in again','Your Claude session expired. Sign in, then try again.']
  };
  var x=m[code]||['Something went wrong','The connection failed. Check your signal and try again.'];
  if(code==='not_granted'||code==='sampling_disabled'||code==='images_unavailable'||code==='capability_disabled'||code==='capability_removed'||code==='not_declared'){
    if(code!=='not_granted'){photo.ready=false;render();x=['Photo reading is not available','Add the medication by hand instead.'];}
  }
  showNotice(x[0],x[1]);
}
async function readLabel(files){
  var note='';
  if(files.length>photo.max){files=files.slice(0,photo.max);note='Using the first '+photo.max+' photos.';}
  photo.ctl=new AbortController();
  showReading(files.length,note);
  var data;
  try{
    data=await photo.sample.json(labelPrompt(files.length),{images:files,modelTier:'default',signal:photo.ctl.signal});
  }catch(e){
    closeSheet();
    if(!e||e.code!=='cancelled')readError(e&&e.code);
    return;
  }
  closeSheet();
  openFromPhoto(data,note);
}
function openFromPhoto(d,extra){
  d=d&&typeof d==='object'&&!Array.isArray(d)?d:{};
  var str=function(v){return typeof v==='string'?v.trim():'';};
  var num=function(v){var n=typeof v==='number'?v:parseFloat(v);return isFinite(n)?n:null;};
  var m=blank(),un=[];
  m.name=str(d.name);if(!m.name)un.push('name');
  m.strength=str(d.strength);if(!m.strength)un.push('strength');
  var u=str(d.unit).toLowerCase(),found=null;
  UNITS.forEach(function(x){if(x.toLowerCase()===u)found=x;});
  if(found)m.unit=found;else un.push('unit');
  var pd=num(d.perDose);if(pd>0)m.perDose=pd;else un.push('perDose');
  var tp=Math.round(num(d.timesPerDay)||0);
  m.times=TIMES[tp]?TIMES[tp].slice():['08:00'];
  un.push('times');
  var q=num(d.qty);
  if(q!==null&&q>0){m.qty=q;m.fillQty=q;}else{m.qty=0;m.fillQty=1;un.push('qty');}
  var r=num(d.refills);
  if(r!==null&&r>=0)m.refills=Math.round(r);else un.push('refills');
  m.pharmacy=str(d.pharmacy);m.prescriber=str(d.prescriber);m.directions=str(d.directions);
  if(!m.directions)un.push('directions');
  if(Array.isArray(d.unclear))d.unclear.forEach(function(k){if(FIELDS.indexOf(k)>=0&&un.indexOf(k)<0)un.push(k);});
  var msg='Read from your photos. Fields marked "check this" were unclear or are suggestions. Compare everything with your bottle before saving. Photos are not saved.';
  var dup=state.meds.some(function(x){return !x.example&&m.name&&x.name.toLowerCase()===m.name.toLowerCase();});
  if(dup)msg+=' You already have '+m.name+'. Saving adds a second entry.';
  if(extra)msg+=' '+extra;
  editing=m;editing._new=true;editing._unclear=un;editing._note=msg;confirmKey=null;
  renderSheet();
  var f=document.getElementById('f-name');if(f)f.focus();
}
async function initPhoto(){
  try{
    if(!window.claude||!window.claude.use)return;
    var s=await window.claude.use('sample');
    if(!s)return;
    var lim=await s.limits();
    if(!lim||!lim.images)return;
    photo.sample=s;photo.max=lim.images.maxCount||3;
    if(lim.images.mediaTypes&&lim.images.mediaTypes.length)document.getElementById('photo-input').accept=lim.images.mediaTypes.join(',');
    photo.ready=true;
    if(!editing)render();
  }catch(e){}
}
document.getElementById('photo-input').addEventListener('change',function(ev){
  var files=Array.prototype.slice.call(ev.target.files||[]);
  ev.target.value='';
  if(files.length&&photo.ready)readLabel(files);
});

/* ---------- saving to the viewer's own Claude account (private, falls back to this browser) ---------- */
function finishBoot(){if(booting){booting=false;render();}}
async function initCloud(){
  if(!booting)return;
  var timer=setTimeout(finishBoot,10000);
  try{
    var u=await window.claude.use('user'),db=await window.claude.use('db');
    var id=u?await u.id():null;
    if(db&&id){
      var doc=db.collection('data/users/'+id).doc('rxkeep');
      var snap=await doc.get();
      var data=snap.exists?snap.data():null;
      if(data&&typeof data.json==='string'){
        var s=JSON.parse(data.json);
        if(s&&Array.isArray(s.meds))state=normalize(s);
        cloud.doc=doc;
      }else{
        cloud.doc=doc;
        if(state.meds.length){cloud.dirty=true;flushCloud();}
      }
    }
  }catch(e){}
  clearTimeout(timer);
  if(booting)finishBoot();else if(!editing)render();
}

/* ---------- start ---------- */
try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t');}catch(e){storageOk=false;}
state=load()||seed();
render();
initPhoto();
initCloud();
})();
</script>
