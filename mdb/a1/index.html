<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f6feb">
  <title>App 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img class="banner" src="banner.svg" alt="Coffee cups on a café table">
  <header>
    <h1 id="title">Loading…</h1>
  </header>
  <main>
    <section class="motw" aria-label="Message of the day">
      <h2>Message of the day</h2>
      <img id="motw" alt="">
    </section>
    <p id="message"></p>
    <ul id="items"></ul>
    <button id="tap" type="button">Tap me</button>
    <p id="count" aria-live="polite"></p>
  </main>
  <script>
    fetch('data.json')
      .then(r => r.json())
      .then(d => {
        document.getElementById('title').textContent = d.title;
        document.title = d.title;
        document.getElementById('message').textContent = d.message;
        // Show today's image. Add ?day=0..6 (0 = Sunday) to preview another day.
        const q = parseInt(new URLSearchParams(location.search).get('day'), 10);
        const day = q >= 0 && q <= 6 ? q : new Date().getDay();
        const w = (d.weekly || [])[day];
        const img = document.getElementById('motw');
        if (w) { img.src = w.image; img.alt = w.alt; }
        else { img.closest('section').hidden = true; }
        const ul = document.getElementById('items');
        d.items.forEach(t => {
          const li = document.createElement('li');
          li.textContent = t;
          ul.appendChild(li);
        });
      })
      .catch(() => {
        document.getElementById('title').textContent = 'App 1';
        document.getElementById('message').textContent = 'Could not load data.json';
      });
    let n = 0;
    document.getElementById('tap').addEventListener('click', () => {
      n++;
      document.getElementById('count').textContent = 'Taps: ' + n;
    });
  </script>
</body>
</html>
