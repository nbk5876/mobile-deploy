<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f6feb">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Joleen &amp; Loki">
  <meta property="og:description" content="Loki has something to say.">
  <meta property="og:url" content="https://www.core3.com/mdb/a1/">
  <meta property="og:image" content="https://www.core3.com/mdb/a1/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>App 1</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <img class="banner" src="banner.svg" alt="Coffee cups on a café table">
  <header>
    <h1 id="title">Loading…</h1>
  </header>
  <main>
    <div class="card">
    <section class="motw" aria-label="Message of the day">
      <h2>Message of the day</h2>
      <img id="motw" alt="" style="display:block;width:100%;max-width:100%;height:auto">
    </section>
    </div>
    <p id="message"></p>
    <button id="tap" type="button">Tap me</button>
    <p id="count" aria-live="polite"></p>
  </main>
  <script>
    const img = document.getElementById('motw');
    let weekly = [], idx = 0;
    function showPhoto() { img.src = weekly[idx].image; img.alt = weekly[idx].alt; }
    fetch("data.json?v=" + Date.now())
      .then(r => r.json())
      .then(d => {
        document.getElementById('title').textContent = d.title;
        document.title = d.title;
        document.getElementById('message').textContent = d.message;
        // Always start on the first image. Add ?start=N to begin on image N instead.
        const q = parseInt(new URLSearchParams(location.search).get('start'), 10);
        weekly = d.weekly || [];
        idx = q >= 0 ? q % (weekly.length || 1) : 0;
        if (weekly.length) showPhoto();
        else img.closest('section').hidden = true;
      })
      .catch(() => {
        document.getElementById('title').textContent = 'App 1';
        document.getElementById('message').textContent = 'Could not load data.json';
      });
    let n = 0;
    document.getElementById('tap').addEventListener('click', () => {
      n++;
      document.getElementById('count').textContent = 'Taps: ' + n;
      if (weekly.length) { idx = (idx + 1) % weekly.length; showPhoto(); }
    });
  </script>
</body>
</html>
