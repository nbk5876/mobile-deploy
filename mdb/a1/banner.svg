<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 60" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Coffee cups on a café table">
  <rect width="390" height="60" fill="#f3e2c7"/>
  <!-- window glow -->
  <rect x="150" y="4" width="90" height="30" rx="3" fill="#fbf1dc"/>
  <path d="M195 4v30M150 19h90" stroke="#e3c99c" stroke-width="2"/>
  <!-- pendant lamps -->
  <g fill="#3b2a20">
    <path d="M55 0v9M335 0v9" stroke="#3b2a20" stroke-width="1.5"/>
    <path d="M45 18a10 9 0 0 1 20 0z"/>
    <path d="M325 18a10 9 0 0 1 20 0z"/>
  </g>
  <circle cx="55" cy="20" r="2.5" fill="#ffd877"/>
  <circle cx="335" cy="20" r="2.5" fill="#ffd877"/>
  <!-- table -->
  <rect y="42" width="390" height="18" fill="#8a5a3b"/>
  <rect y="42" width="390" height="3" fill="#a8714b"/>
  <path d="M0 51h390M0 56h390" stroke="#7a4e32" stroke-width="1"/>
  <!-- cup 1: cream -->
  <g transform="translate(75 0)">
    <ellipse cx="0" cy="46" rx="17" ry="3.2" fill="#fff"/>
    <path d="M-11 27h22v7a11 11 0 0 1-22 0z" fill="#fff"/>
    <path d="M11 29h2.5a4 4 0 0 1 0 8H10" fill="none" stroke="#fff" stroke-width="2"/>
    <ellipse cx="0" cy="27" rx="11" ry="2.4" fill="#5b3a29"/>
    <path d="M-3 22q-3-4 0-8M3 22q3-4 0-8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
  </g>
  <!-- cup 2: terracotta, taller latte glass-style mug -->
  <g transform="translate(195 0)">
    <ellipse cx="0" cy="47" rx="18" ry="3.4" fill="#f7efe2"/>
    <path d="M-12 24h24v10a12 12 0 0 1-24 0z" fill="#c8643c"/>
    <path d="M12 27h3a4.5 4.5 0 0 1 0 9h-4" fill="none" stroke="#c8643c" stroke-width="2.2"/>
    <ellipse cx="0" cy="24" rx="12" ry="2.6" fill="#e9d3b4"/>
    <path d="M-5 24q5-2 10 0" stroke="#8a5a3b" stroke-width="1.2" fill="none"/>
    <path d="M-4 19q-3-4 0-8M4 19q3-4 0-8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
  </g>
  <!-- cup 3: teal -->
  <g transform="translate(315 0)">
    <ellipse cx="0" cy="46" rx="17" ry="3.2" fill="#fff"/>
    <path d="M-11 27h22v7a11 11 0 0 1-22 0z" fill="#2f8f8a"/>
    <path d="M-11 29h-2.5a4 4 0 0 0 0 8H-10" fill="none" stroke="#2f8f8a" stroke-width="2"/>
    <ellipse cx="0" cy="27" rx="11" ry="2.4" fill="#4a2f21"/>
    <path d="M-3 22q-3-4 0-8M3 22q3-4 0-8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
  </g>
  <!-- beans on table -->
  <g fill="#3b2a20">
    <ellipse cx="130" cy="50" rx="3" ry="1.8" transform="rotate(-20 130 50)"/>
    <ellipse cx="137" cy="53" rx="3" ry="1.8" transform="rotate(25 137 53)"/>
    <ellipse cx="255" cy="51" rx="3" ry="1.8" transform="rotate(15 255 51)"/>
    <ellipse cx="262" cy="54" rx="3" ry="1.8" transform="rotate(-25 262 54)"/>
  </g>
</svg>
